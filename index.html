<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll to Change Image</title>
    <style>
        body {
            margin: 0;
            height: 10000vh; /* Make the page scrollable */
            background-image: url('Visuals/arianaBackground.png');
            background-attachment: fixed;

        }
        img {
            width: 300px;
            /* transition: all 0.5s ease-in-out;  */
            position: fixed; /* Fix the image in place */
            top: 50%; /* Position it vertically at the center */
            left: 10%; /* Position it horizontally at the center */
            transform: translate(-50%, -50%); /* Offset the image to exactly center it */
        }
    </style>
</head>
<body>

    <button onclick="toggleAudio()">
        <img src="Visuals/soundOn.png" alt="Play" style="top: 50px; left: 50px; width:40px; filter: drop-shadow(2px 2px 1px rgba(0, 0, 0, 0.5));">
    </button>
    <audio id="audio" loop>
        <source src="Audio/Music.mp3" type="audio/mp3">
    </audio>

    <img id="image" src="Visuals/ariana1.png" alt="Image">
    <img id="blinking-image" src="Visuals/ScrollDown.png" alt="Blinking Image">



    <script>

        let beginning = true;

        window.onload = () => {
            // Scroll to the middle of the page
            window.scrollTo(0, document.body.scrollHeight / 2 - window.innerHeight / 2);

        };

        function toggleAudio() {
        const audio = document.getElementById("audio");
        if (audio.paused) {
            audio.play();
        } else {
            audio.pause();
        }
    }

       

        
        
        const imageConfigs = [
            { width: "340px", top: "50%" },
            { width: "340px", top: "50%" },
            { width: "300px", top: "50%" },
            { width: "340px", top: "50%" },
            { width: "300px", top: "50%" },
            { width: "340px", top: "50%" },
            { width: "300px", top: "50%" },
            { width: "340px", top: "50%" },
            { width: "300px", top: "50%" },
            { width: "240px", top: "43%" },
            { width: "250px", top: "43%" },
            { width: "250px", top: "43%" },
            { width: "250px", top: "38%" },
            { width: "250px", top: "35.2%" },
            { width: "250px", top: "50%" },
            { width: "250px", top: "50%" },
            { width: "210px", top: "50%" },
            { width: "170px", top: "50%" },
            { width: "120px", top: "50%" },
            { width: "80px", top: "50%" },
            { width: "50px", top: "50%" },
            { width: "20px", top: "50%" },
            { width: "0px", top: "50%" },
            { width: "100px", top: "50%" },
            { width: "200px", top: "50%" },
            { width: "300px", top: "50%" },
            { width: "400px", top: "50%" },
            { width: "600px", top: "50%" },
            { width: "900px", top: "50%" },
            { width: "1000px", top: "50%" },
            { width: "1000px", top: "50%" },
            { width: "1000px", top: "50%" },
        ];

        const images = [];
        for (let i = 1; i <= 31; i++) {
        images[i] = new Image();
        images[i].src = `Visuals/ariana${i}.png`;
        }

        const img = document.getElementById("image");
        let imgIndex = 0;
        let lastScrollY = 0;
        let scrollThreshold = 100;
        let accumulatedScroll = 0;
        let ticking = false;
        const maxWidth = window.innerWidth * 0.95;

        
        const scrollDownImage = document.getElementById("blinking-image");
        scrollDownImage.style.left = "50%";

        // Make the image blink every 500ms
        const blinkInterval = setInterval(() => {
        scrollDownImage.style.visibility = (scrollDownImage.style.visibility === "hidden") ? "visible" : "hidden";
        }, 600);
        let scrollCount = 0;

        const removeOnSecondScroll = () => {
            scrollCount++;
            console.log(scrollCount);
            if (scrollCount === 3) {
                clearInterval(blinkInterval); // Stop blinking
                scrollDownImage.remove(); // Remove the image
                window.removeEventListener("scroll", removeOnSecondScroll); // Remove event listener
            }
        };

        // Remove the image when scrolling starts
        window.addEventListener("scroll", removeOnSecondScroll);

        function updateImage() {
            const config = imageConfigs[imgIndex - 1];
            if (window.innerWidth > 769)
            {img.style.width = config.width;}
            else {img.style.width = maxWidth;}
            img.style.top = config.top;
            img.src = `Visuals/ariana${imgIndex}.png`;
            
            let newPosition =+ Math.min(10 + 4 * imgIndex, 47 +  (Math.floor(imgIndex/17) + Math.floor(imgIndex / 18) + Math.floor(imgIndex / 19) +  Math.floor(imgIndex/20)+  Math.floor(imgIndex/21)+Math.floor(imgIndex/22))/2);
            img.style.left = `${newPosition}%`;

            
            if (imgIndex === 31) {
                img.addEventListener('click', function() {
                window.open('https://lu.ma/4tegf5zb', '_blank');
                });              
            }

            ticking = false;
        }

        window.addEventListener("scroll", () => {
            let deltaY = window.scrollY - lastScrollY;
            accumulatedScroll += deltaY;
            if (Math.abs(accumulatedScroll) >= scrollThreshold) {
                const scrollDirection = window.scrollY > lastScrollY ? 1 : -1;
                imgIndex = Math.max(1, Math.min(31, imgIndex + scrollDirection));
                lastScrollY = window.scrollY;
                accumulatedScroll = 0;
                begginning = false;

            if (!ticking) {
                requestAnimationFrame(updateImage);
                ticking = true;
            }
        }
            });





    </script>

</body>
</html>
